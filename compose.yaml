# Lightweight production stack — podman-compose / docker-compose compatible.
# Frontend deployed separately to static CDN (Cloudflare Pages / Vercel).
# Usage:
#   cp .env.example .env   # fill JWT_SECRET, CORS_ORIGIN, POSTGRES_PASSWORD
#   podman-compose up --build -d   # or: docker compose up --build -d

services:
  db:
    image: docker.io/library/postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      PORT: ${PORT:-4000}
      # Compose overrides localhost DATABASE_URL to reach `db` service.
      # Remove to use DATABASE_URL from .env verbatim.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/school_crm
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
